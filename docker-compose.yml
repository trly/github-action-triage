services:
  redis:
    image: redis:7-alpine
    container_name: triage-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: triage-web
    command: sh -c "cd /app && /app/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./main.py:/app/main.py:ro
    environment:
      TRIAGE_REDIS_URL: redis://redis:6379/0
      TRIAGE_GITHUB_WEBHOOK_SECRET: ${TRIAGE_GITHUB_WEBHOOK_SECRET}
      TRIAGE_ANTHROPIC_API_KEY: ${TRIAGE_ANTHROPIC_API_KEY}
      TRIAGE_GITHUB_APP_ID: ${TRIAGE_GITHUB_APP_ID}
      TRIAGE_GITHUB_PRIVATE_KEY: ${TRIAGE_GITHUB_PRIVATE_KEY}
      TRIAGE_MCP_ENABLE_SOURCEGRAPH: ${TRIAGE_MCP_ENABLE_SOURCEGRAPH:-false}
      TRIAGE_SOURCEGRAPH_TOKEN: ${TRIAGE_SOURCEGRAPH_TOKEN:-}
      TRIAGE_SOURCEGRAPH_MCP_URL: ${TRIAGE_SOURCEGRAPH_MCP_URL:-}
      TRIAGE_LOG_LEVEL: ${TRIAGE_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: triage-worker
    command: sh -c "cd /app && /app/venv/bin/python -m celery -A github_action_triage.app.celery_app:app worker --loglevel=debug --concurrency=2"
    user: appuser
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src:ro
    environment:
      TRIAGE_REDIS_URL: redis://redis:6379/0
      TRIAGE_ANTHROPIC_API_KEY: ${TRIAGE_ANTHROPIC_API_KEY}
      TRIAGE_GITHUB_APP_ID: ${TRIAGE_GITHUB_APP_ID}
      TRIAGE_GITHUB_PRIVATE_KEY: ${TRIAGE_GITHUB_PRIVATE_KEY}
      TRIAGE_MCP_ENABLE_SOURCEGRAPH: ${TRIAGE_MCP_ENABLE_SOURCEGRAPH:-false}
      TRIAGE_SOURCEGRAPH_TOKEN: ${TRIAGE_SOURCEGRAPH_TOKEN:-}
      TRIAGE_SOURCEGRAPH_MCP_URL: ${TRIAGE_SOURCEGRAPH_MCP_URL:-}
      TRIAGE_DISABLE_ISSUE_CREATION: ${TRIAGE_DISABLE_ISSUE_CREATION:-false}
      TRIAGE_LOG_LEVEL: ${TRIAGE_LOG_LEVEL:-INFO}
      TRIAGE_ANALYSIS_MODEL: ${TRIAGE_ANALYSIS_MODEL:-}
      TRIAGE_ANALYSIS_OLLAMA_BASE_URL: ${TRIAGE_ANALYSIS_OLLAMA_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
